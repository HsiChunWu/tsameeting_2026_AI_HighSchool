<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>公式守衛</title>
<!--
  公式守衛（單檔網頁版）
  雙擊這個檔案就能玩，不需要網路。

  要改題目、關卡或數值：往下找「資料」區，每個 <script type="application/json"> 是一個資料檔，
  欄位跟原本 Godot 版的 JSON 一樣，說明見同資料夾的「說明.md」。改完存檔、重新整理網頁即可。
  改完可以跑測試：node tests/run_tests.js

  字型：Noto Sans TC、Noto Sans 的精簡版，SIL Open Font License 1.1，授權全文放在本檔最後。
-->
<style>
:root {
  --bg: #212b33;
  --panel: #2a3540;
  --panel-2: #33404c;
  --line: #45535f;
  --text: #eaeef2;
  --muted: #a9b4be;
  --accent: #f2a54a;
  --good: #73e680;
  --bad: #ff8073;
  --warn: #ffcc66;
  --hint: #8cccff;
  --star: #ffd14d;
  --font: "GameTC", "GameLatin", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}
[hidden] { display: none !important; }
button {
  font: inherit;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  min-height: 44px;
  padding: 6px 14px;
  cursor: pointer;
  touch-action: manipulation;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.screen { position: fixed; inset: 0; height: 100vh; height: 100dvh; }

/* ---------- 選關、教師檢視 ---------- */
.page {
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  height: 100%; overflow-y: auto; padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
}
.page h1 { font-size: 40px; margin: 8px 0 0; letter-spacing: 0.1em; }
.page h2 { font-size: 24px; margin: 0; color: var(--muted); font-weight: normal; }
#level-list { display: flex; flex-direction: column; gap: 18px; width: min(420px, 100%); }
.level-row { display: flex; flex-direction: column; gap: 4px; }
.level-button { font-size: 28px; min-height: 72px; }
.level-stars { text-align: center; color: var(--star); font-size: 20px; }
.errors { color: var(--warn); white-space: pre-wrap; max-width: 640px; }

.teacher { width: min(720px, 100%); }
.teacher table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 22px; }
.teacher th { text-align: left; color: var(--muted); font-weight: normal; font-size: 18px; padding: 0 12px; }
.teacher td { background: var(--panel); padding: 8px 12px; }
.teacher td:first-child { border-radius: 8px 0 0 8px; }
.teacher td:last-child { border-radius: 0 8px 8px 0; }
.teacher .num, .teacher th.num { text-align: right; }
.teacher .marker { width: 4.5em; }
.teacher tr.lowest td { background: #59301f; color: #ff9959; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; margin-top: 8px; }
.notice { color: var(--warn); white-space: pre-wrap; }

/* ---------- 遊戲 ---------- */
#screen-game {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 40%);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#screen-game[hidden] { display: none; }
.field-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.hud {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 6px 12px; font-size: 18px; min-height: 44px;
}
.hud .combo { color: var(--text); }
.hud .combo.boosted { color: var(--accent); font-weight: bold; }
.hud .spacer { flex: 1; }
.hud button { min-height: 36px; padding: 2px 14px; }
#field-wrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#field { display: block; }
#answer-overlay {
  position: absolute; inset: 0; background: rgba(0, 0, 0, 0.3);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none; text-shadow: 0 0 6px #000, 0 0 3px #000;
}
#answer-overlay .title { font-size: clamp(28px, min(7vw, 9vh), 56px); font-weight: bold; }
#answer-overlay .sub { font-size: clamp(15px, min(3.4vw, 4.5vh), 26px); }
.pace-bar { display: flex; align-items: center; gap: 8px; padding: 6px 12px 10px; flex-wrap: wrap; }
.pace-bar button { min-width: 64px; }
.pace-bar button.on { background: var(--accent); color: #1b1408; border-color: var(--accent); font-weight: bold; }

.hand-col {
  display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto;
  padding: 12px 16px; background: var(--panel); border-left: 1px solid var(--line);
}
.hand { display: flex; gap: 8px; }
.hand .card { flex: 1 1 0; min-width: 0; min-height: 64px; font-size: 20px; font-weight: bold; padding: 6px 4px; }
.hand.locked .card { opacity: 0.35; }
.card-formula { background: #2d5a7a; }
.card-theorem { background: #6a4a8c; }
.card-graph { background: #2f6e52; }
.card-proof { background: #8a4b2c; }
.question { font-size: 24px; line-height: 1.5; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.options .option { font-size: 22px; min-height: 56px; overflow-wrap: anywhere; }
.feedback { font-size: 22px; min-height: 1.5em; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }
.feedback.warn { color: var(--warn); }

/* ---------- 結算、暫停 ---------- */
.modal {
  position: fixed; inset: 0; z-index: 10; background: rgba(10, 14, 18, 0.82);
  display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
}
.modal-panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  width: min(1040px, 100%); max-height: 100%; overflow-y: auto; padding: 24px;
}
.pause-panel { width: min(420px, 100%); text-align: center; }
.pause-panel h2 { font-size: 32px; margin: 0 0 16px; }
.pause-panel .actions { flex-direction: column; align-items: stretch; }
.results-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 24px; }
.modal-panel.narrow { width: min(560px, 100%); }
.modal-panel.narrow .results-grid { grid-template-columns: 1fr; }
.headline { font-size: 48px; font-weight: bold; margin: 0; }
.headline.good { color: var(--good); }
.headline.bad { color: var(--bad); }
.res-accuracy { font-size: 22px; white-space: pre-wrap; }
.res-stars { font-size: 26px; color: var(--star); margin-top: 8px; }
.res-detail { white-space: pre-wrap; color: var(--muted); }
.results h3 { font-size: 20px; margin: 16px 0 6px; color: var(--muted); font-weight: normal; }
.results ul, .results ol { margin: 0; padding-left: 1.2em; }
#res-review { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 14px; }
#res-review .q { font-size: 20px; }
#res-review .hint { color: var(--hint); }
#res-review .reveal { margin-top: 4px; font-size: 18px; }
#res-review .answer { display: flex; flex-wrap: wrap; gap: 4px 24px; margin-top: 4px; }
#res-review .chosen { color: var(--bad); }
#res-review .correct { color: var(--good); }

/* ---------- 直拿手機：戰場在上，手牌、題目在下 ---------- */
@media (max-aspect-ratio: 4/5) {
  #screen-game { display: flex; flex-direction: column; }
  .field-col { flex: 1 1 auto; }
  .hand-col { flex: 0 0 auto; border-left: 0; border-top: 1px solid var(--line); gap: 8px; padding: 10px 12px; overflow: visible; }
  .hud { font-size: 16px; gap: 12px; min-height: 40px; padding: 4px 10px; }
  .pace-bar { padding: 4px 10px 6px; font-size: 16px; }
  .hand .card { min-height: 52px; font-size: 18px; }
  .question { font-size: 18px; }
  .options .option { font-size: 18px; min-height: 48px; }
  .feedback { font-size: 17px; }
  .results-grid { grid-template-columns: 1fr; }
  .headline { font-size: 40px; }
}
/* ---------- 橫拿手機等矮螢幕 ---------- */
@media (max-height: 500px) and (min-aspect-ratio: 4/5) {
  #screen-game { grid-template-columns: minmax(0, 1fr) minmax(280px, 46%); }
  .hud { font-size: 15px; min-height: 34px; padding: 2px 10px; }
  .hud button { min-height: 30px; }
  .pace-bar { padding: 2px 10px 4px; font-size: 15px; }
  .pace-bar button { min-height: 36px; }
  .hand-col { gap: 6px; padding: 8px 10px; }
  .hand .card { min-height: 44px; font-size: 16px; }
  .question { font-size: 16px; }
  .options .option { font-size: 16px; min-height: 44px; }
  .feedback { font-size: 15px; }
  .page h1 { font-size: 30px; }
  .level-button { min-height: 56px; font-size: 24px; }
  .modal-panel { padding: 14px 18px; }
  .headline { font-size: 30px; }
  .res-accuracy { font-size: 17px; }
  .res-stars { font-size: 19px; margin-top: 2px; }
  .res-detail { font-size: 15px; line-height: 1.35; }
  .results h3 { margin: 8px 0 4px; font-size: 16px; }
  #res-all-correct { margin: 8px 0; font-size: 16px; }
  .results .actions { margin-top: 4px; }
}
@media (max-width: 640px) {
  .results-grid { grid-template-columns: 1fr; }
  .modal-panel { padding: 18px; }
}
</style>
</head>
<body>

<!-- ======================= 畫面 ======================= -->
<section id="screen-select" class="screen" hidden>
  <div class="page">
    <h1>公式守衛</h1>
    <h2>選擇關卡</h2>
    <div id="level-list"></div>
    <p id="level-errors" class="errors" hidden></p>
    <button id="btn-teacher">教師檢視</button>
  </div>
</section>

<section id="screen-teacher" class="screen" hidden>
  <div class="page">
    <div class="teacher">
      <h1>教師檢視</h1>
      <p id="teacher-notice" class="notice" hidden></p>
      <table id="teacher-table">
        <thead><tr><th></th><th>單元</th><th class="num">作答題數</th><th class="num">答對率</th></tr></thead>
        <tbody id="teacher-rows"></tbody>
      </table>
      <p id="teacher-empty">尚無資料</p>
      <div class="actions">
        <button id="btn-clear">清除資料</button>
        <span id="confirm-box" hidden>確定清除？ <button id="btn-confirm-yes">確定</button> <button id="btn-confirm-no">取消</button></span>
        <button id="btn-teacher-back">回到關卡選擇</button>
      </div>
    </div>
  </div>
</section>

<section id="screen-game" class="screen" hidden>
  <div class="field-col">
    <div class="hud">
      <span id="hud-wave"></span>
      <span id="hud-time"></span>
      <span id="hud-combo" class="combo" hidden></span>
      <span class="spacer"></span>
      <button id="btn-pause">暫停</button>
    </div>
    <div id="field-wrap">
      <canvas id="field" aria-label="戰場：怪物沿路線走向基地"></canvas>
      <div id="answer-overlay" hidden><div class="title">作答中</div><div id="overlay-sub" class="sub"></div></div>
    </div>
    <div id="pace-bar" class="pace-bar">
      作答時怪物：
      <button data-pace="stop">停止</button>
      <button data-pace="slow">變慢</button>
      <button data-pace="normal">挑戰</button>
    </div>
  </div>
  <div class="hand-col">
    <div id="hand" class="hand"></div>
    <div id="question" class="question" hidden></div>
    <div id="options" class="options" hidden></div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
  </div>

  <div id="pause-overlay" class="modal" hidden>
    <div class="modal-panel pause-panel">
      <h2>暫停中</h2>
      <div class="actions">
        <button id="btn-resume">繼續</button>
        <button id="btn-pause-quit">回到關卡選擇</button>
      </div>
    </div>
  </div>

  <div id="results" class="modal results" hidden>
    <div id="results-panel" class="modal-panel">
      <div class="results-grid">
        <div>
          <p id="res-headline" class="headline"></p>
          <div id="res-accuracy" class="res-accuracy"></div>
          <div id="res-stars" class="res-stars"></div>
          <div id="res-detail" class="res-detail"></div>
          <div id="res-units-box"><h3>答錯的單元</h3><ul id="res-units"></ul></div>
          <p id="res-all-correct">全部答對，沒有答錯的單元</p>
          <div class="actions" style="justify-content:flex-start">
            <button id="btn-again">再玩一次</button>
            <button id="btn-results-back">回到關卡選擇</button>
          </div>
        </div>
        <div id="res-review-box"><h3>答錯的題目</h3><ol id="res-review"></ol></div>
      </div>
    </div>
  </div>
</section>

<!-- ======================= 資料 ======================= -->
<!-- 關卡：欄位說明見「說明.md」。*_path 只看檔名，對應下面 data-file 相同的資料區塊。 -->
<script type="application/json" data-file="levels.json">
{
	"levels": [
		{
			"id": "log-demo",
			"display_name": "指對數 示範關",
			"unit": "指對數",
			"questions_path": "res://assets/data/questions.json",
			"card_effects_path": "res://assets/data/card_effects.json",
			"deck_path": "res://assets/data/deck.json",
			"waves_path": "res://assets/data/waves_level_demo.json",
			"play_cooldown_seconds": 2.5,
			"wave_difficulty": [1, 2, 3],
			"answer_slow_time_scale": 0.3,
			"star_base_hp_percent": 50,
			"star_accuracy_percent": 80
		},
		{
			"id": "trig-demo",
			"display_name": "三角函數 示範關",
			"unit": "三角函數",
			"questions_path": "res://assets/data/questions.json",
			"card_effects_path": "res://assets/data/card_effects.json",
			"deck_path": "res://assets/data/deck.json",
			"waves_path": "res://assets/data/waves_level_trig.json",
			"play_cooldown_seconds": 2.5,
			"wave_difficulty": [1, 2, 3],
			"answer_slow_time_scale": 0.3,
			"star_base_hp_percent": 50,
			"star_accuracy_percent": 80
		}
	]
}
</script>

<!-- 題庫：只用原創題。correct 要和某個選項的文字完全相同；hint 是結算時顯示的提示，不可寫出答案。 -->
<script type="application/json" data-file="questions.json">
{
  "questions": [
    {"id": "log-001", "unit": "指對數", "difficulty": 1, "text": "log₂ 8 的值為何？", "options": ["2", "3", "4", "8"], "correct": "3", "hint": "log₂ 8 是在問：2 的幾次方等於 8？"},
    {"id": "log-002", "unit": "指對數", "difficulty": 1, "text": "若 2ˣ = 32，則 x 的值為何？", "options": ["4", "5", "6", "16"], "correct": "5", "hint": "把 32 寫成 2 的次方。"},
    {"id": "log-003", "unit": "指對數", "difficulty": 2, "text": "log₁₀ 2 + log₁₀ 5 的值為何？", "options": ["0", "1", "7", "10"], "correct": "1", "hint": "同底數的對數相加，真數相乘：log a + log b = log (ab)。"},
    {"id": "log-004", "unit": "指對數", "difficulty": 2, "text": "log₃ 81 − log₃ 9 的值為何？", "options": ["1", "2", "3", "9"], "correct": "2", "hint": "同底數的對數相減，真數相除：log a − log b = log (a/b)。"},
    {"id": "log-005", "unit": "指對數", "difficulty": 3, "text": "方程式 4ˣ − 3·2ˣ + 2 = 0 的所有實數解之和為何？", "options": ["0", "1", "2", "3"], "correct": "1", "hint": "令 t = 2ˣ（t > 0），先解 t 的二次方程式，再換回 x。"},
    {"id": "log-006", "unit": "指對數", "difficulty": 3, "text": "已知 log₁₀ 2 ≈ 0.3010，則 2¹⁰ 是幾位數？", "options": ["3 位數", "4 位數", "5 位數", "10 位數"], "correct": "4 位數", "hint": "N 的位數 = log₁₀ N 的整數部分 + 1；log₁₀ 2¹⁰ = 10 × log₁₀ 2。"},
    {"id": "trig-001", "unit": "三角函數", "difficulty": 1, "text": "sin 30° 的值為何？", "options": ["1/2", "√2/2", "√3/2", "1"], "correct": "1/2", "hint": "想 30°-60°-90° 三角形，三邊比是 1 : √3 : 2；sin = 對邊／斜邊。"},
    {"id": "trig-002", "unit": "三角函數", "difficulty": 1, "text": "tan 45° 的值為何？", "options": ["0", "1/2", "1", "√3"], "correct": "1", "hint": "45°-45°-90° 三角形的兩股相等；tan = 對邊／鄰邊。"},
    {"id": "trig-003", "unit": "三角函數", "difficulty": 2, "text": "設 θ 為第一象限角且 sin θ = 3/5，則 cos θ 的值為何？", "options": ["3/4", "4/5", "5/3", "1/5"], "correct": "4/5", "hint": "用 sin²θ + cos²θ = 1，第一象限的 cos θ 為正。"},
    {"id": "trig-004", "unit": "三角函數", "difficulty": 2, "text": "sin 150° 的值為何？", "options": ["1/2", "−1/2", "√3/2", "−√3/2"], "correct": "1/2", "hint": "150° = 180° − 30°，而 sin (180° − θ) = sin θ。"},
    {"id": "trig-005", "unit": "三角函數", "difficulty": 2, "text": "設 θ 為第一象限角且 tan θ = 2，則 sin θ·cos θ 的值為何？", "options": ["1/5", "2/5", "2/3", "4/5"], "correct": "2/5", "hint": "畫直角三角形：對邊 2、鄰邊 1，先求斜邊，再算 sin θ 和 cos θ。"},
    {"id": "trig-006", "unit": "三角函數", "difficulty": 3, "text": "△ABC 中，AB = 5，AC = 3，∠A = 60°，則 BC 的長度為何？", "options": ["√19", "√34", "2√7", "7"], "correct": "√19", "hint": "用餘弦定理：BC² = AB² + AC² − 2·AB·AC·cos A。"},
    {"id": "trig-007", "unit": "三角函數", "difficulty": 3, "text": "方程式 2 sin x − 1 = 0 在 0 ≤ x < 2π 的所有解之和為何？", "options": ["π/2", "π", "7π/6", "2π"], "correct": "π", "hint": "先解出 sin x 的值，再找 0 到 2π 之間所有符合的角。"},
    {"id": "log-007", "unit": "指對數", "difficulty": 1, "text": "log₃ 27 的值為何？", "options": ["2", "3", "9", "27"], "correct": "3", "hint": "log₃ 27 是在問：3 的幾次方等於 27？"},
    {"id": "log-008", "unit": "指對數", "difficulty": 1, "text": "若 3ˣ = 81，則 x 的值為何？", "options": ["3", "4", "9", "27"], "correct": "4", "hint": "把 81 寫成 3 的次方。"},
    {"id": "log-009", "unit": "指對數", "difficulty": 1, "text": "log₅ 125 的值為何？", "options": ["2", "3", "5", "25"], "correct": "3", "hint": "log₅ 125 是在問：5 的幾次方等於 125？"},
    {"id": "log-010", "unit": "指對數", "difficulty": 1, "text": "log₁₀ 0.01 的值為何？", "options": ["−2", "−1", "1", "2"], "correct": "−2", "hint": "0.01 = 1/100，把它寫成 10 的次方。"},
    {"id": "log-011", "unit": "指對數", "difficulty": 1, "text": "2 的 −3 次方的值為何？", "options": ["−8", "−6", "1/8", "1/6"], "correct": "1/8", "hint": "負次方代表倒數：2 的 −n 次方 = 1 / (2 的 n 次方)。"},
    {"id": "log-012", "unit": "指對數", "difficulty": 1, "text": "log₇ 7 的值為何？", "options": ["0", "1", "7", "49"], "correct": "1", "hint": "log₇ 7 是在問：7 的幾次方等於 7？"},

<script id="logic">
// ===== 遊戲規則（不碰畫面，可單獨測試：node tests/run_tests.js）=====
// 從 Godot 版 src/ 逐條移植；數字與判斷要和 Godot 版一致。
const Logic = (() => {
  "use strict";

  // ---------- 小工具 ----------
  const isNumber = (v) => typeof v === "number" && !Number.isNaN(v);
  const isFiniteNumber = (v) => typeof v === "number" && Number.isFinite(v);
  const isWhole = (v) => isFiniteNumber(v) && Math.floor(v) === v;
  const isPlainObject = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
  // Godot 的 roundi：.5 遠離 0
  const roundi = (v) => (v < 0 ? -Math.round(-v) : Math.round(v));

  function parseJson(text, errors) {
    try {
      return JSON.parse(text);
    } catch (e) {
      errors.push("JSON 格式錯誤：" + e.message);
      return undefined;
    }
  }

  // 可指定種子的亂數（測試用固定種子；遊戲用隨機種子）
  function makeRng(seed) {
    let a = seed ? seed >>> 0 : (Math.random() * 4294967296) >>> 0;
    return {
      // lo..hi（含兩端）的整數
      randiRange(lo, hi) {
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        const r = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        return lo + Math.floor(r * (hi - lo + 1));
      },
    };
  }

  // 簡單的事件
  class Emitter {
    constructor() { this._handlers = {}; }
    on(name, fn) { (this._handlers[name] ||= []).push(fn); }
    emit(name, ...args) { for (const fn of this._handlers[name] || []) fn(...args); }
  }

  // ---------- 題庫 ----------
  const ANY_DIFFICULTY = -1;
  const MIN_OPTIONS = 4;

  class QuestionBank {
    constructor(rng) {
      this.rng = rng || makeRng();
      this.questions = [];
      this.used = new Set();
    }

    loadFromText(text) {
      const errors = [];
      this.questions = [];
      this.used.clear();
      const data = parseJson(text, errors);
      if (errors.length) return { loaded: 0, errors };
      if (!isPlainObject(data) || !Array.isArray(data.questions)) {
        errors.push("題庫最外層要有 \"questions\" 陣列");
        return { loaded: 0, errors };
      }
      const seen = new Set();
      data.questions.forEach((entry, i) => {
        const problem = QuestionBank.validate(entry, seen);
        if (problem) {
          errors.push(`questions[${i}]：${problem}（略過）`);
          return;
        }
        seen.add(entry.id);
        this.questions.push({
          id: entry.id, unit: entry.unit, difficulty: entry.difficulty, text: entry.text,
          options: entry.options.slice(), correct: entry.correct,
          hint: typeof entry.hint === "string" ? entry.hint.trim() : "",
        });
      });
      return { loaded: this.questions.length, errors };
    }

    static validate(entry, seen) {
      if (!isPlainObject(entry)) return "不是物件";
      for (const f of ["id", "unit", "difficulty", "text", "options", "correct"]) {
        if (!(f in entry)) return `缺少欄位 "${f}"`;
      }
      for (const f of ["id", "unit", "text", "correct"]) {
        if (typeof entry[f] !== "string") return `欄位 "${f}" 要是文字`;
        if (!entry[f].trim()) return `欄位 "${f}" 不能空白`;
      }
      const id = entry.id;
      if (seen.has(id)) return `id 重複："${id}"`;
      if (!isNumber(entry.difficulty)) return `"difficulty" 要是數字（${id}）`;
      if (!isWhole(entry.difficulty) || entry.difficulty < 1) return `"difficulty" 要是 1 以上的整數（${id}）`;
      if (!Array.isArray(entry.options)) return `"options" 要是陣列（${id}）`;
      if (entry.options.length < MIN_OPTIONS) return `至少要 ${MIN_OPTIONS} 個選項，只有 ${entry.options.length} 個（${id}）`;
      if (entry.options.some((o) => typeof o !== "string")) return `每個選項都要是文字（${id}）`;
      if (new Set(entry.options).size !== entry.options.length) return `選項重複（${id}）`;
      if (!entry.options.includes(entry.correct)) return `正確答案 "${entry.correct}" 不在選項裡（${id}）`;
      if ("hint" in entry && typeof entry.hint !== "string") return `"hint" 要是文字（${id}）`;
      return "";
    }

    // 回傳 { status: "ok" | "none" | "exhausted", question }
    draw(unit, difficulty = ANY_DIFFICULTY) {
      let matching = 0;
      const fresh = [];
      for (const q of this.questions) {
        if (q.unit !== unit) continue;
        if (difficulty !== ANY_DIFFICULTY && q.difficulty !== difficulty) continue;
        matching++;
        if (!this.used.has(q.id)) fresh.push(q);
      }
      if (matching === 0) return { status: "none", question: null };
      if (fresh.length === 0) return { status: "exhausted", question: null };
      const question = fresh[this.rng.randiRange(0, fresh.length - 1)];
      this.used.add(question.id);
      return { status: "ok", question };
    }

    resetUnit(unit) {
      for (const q of this.questions) if (q.unit === unit) this.used.delete(q.id);
    }

    unitQuestionCount(unit) {
      return this.questions.filter((q) => q.unit === unit).length;
    }
  }

  // ---------- 卡牌效果、作答紀錄、加成 ----------
  const FALLBACK_WRONG_MULTIPLIER = 0.5;

  class AnswerLog {
    constructor() { this.records = []; }
    append(r) { this.records.push(r); }
    totalCount() { return this.records.length; }
    correctCount() { return this.records.filter((r) => r.isCorrect).length; }
    unitTotal(unit) { return this.records.filter((r) => r.unit === unit).length; }
    unitCorrect(unit) { return this.records.filter((r) => r.unit === unit && r.isCorrect).length; }
    maxStreak() {
      let best = 0, cur = 0;
      for (const r of this.records) {
        cur = r.isCorrect ? cur + 1 : 0;
        best = Math.max(best, cur);
      }
      return best;
    }
    units() {
      const out = [];
      for (const r of this.records) if (!out.includes(r.unit)) out.push(r.unit);
      return out;
    }
  }

  const isMultiplier = (v) => isFiniteNumber(v) && v >= 1;

  class AnswerEffect {
    constructor() {
      this.cards = new Map();
      this.wrongMultiplier = FALLBACK_WRONG_MULTIPLIER;
      this.log = new AnswerLog();
      this.clearBonus();
    }

    clearBonus() {
      this.streakTiers = [];
      this.difficultyMultipliers = [];
      this.maxBonusMultiplier = 1;
    }

    loadFromText(text) {
      const errors = [];
      this.cards.clear();
      this.wrongMultiplier = FALLBACK_WRONG_MULTIPLIER;
      this.clearBonus();
      const root = parseJson(text, errors);
      if (errors.length) return { loaded: 0, errors };
      if (!isPlainObject(root)) return { loaded: 0, errors: ["卡牌效果最外層要是物件"] };

      const w = root.wrong_answer_multiplier;
      if (!("wrong_answer_multiplier" in root)) errors.push(`缺少 "wrong_answer_multiplier"，改用 ${FALLBACK_WRONG_MULTIPLIER}`);
      else if (!isNumber(w) || w < 0 || w > 1) errors.push(`"wrong_answer_multiplier" 要在 0 到 1 之間，改用 ${FALLBACK_WRONG_MULTIPLIER}`);
      else this.wrongMultiplier = w;

      if ("bonus" in root) {
        const problem = this.loadBonus(root.bonus);
        if (problem) {
          this.clearBonus();
          errors.push(`bonus：${problem}；停用加成`);
        }
      }

      if (!Array.isArray(root.cards)) {
        errors.push("卡牌效果要有 \"cards\" 陣列");
        return { loaded: 0, errors };
      }
      root.cards.forEach((entry, i) => {
        const problem = this.validateCard(entry);
        if (problem) {
          errors.push(`cards[${i}]：${problem}（略過）`);
          return;
        }
        this.cards.set(entry.id, { id: entry.id, displayName: entry.display_name, baseStrength: entry.base_strength });
      });
      return { loaded: this.cards.size, errors };
    }

    loadBonus(bonus) {
      if (!isPlainObject(bonus)) return "要是物件";
      if (!isMultiplier(bonus.max_total_multiplier)) return "\"max_total_multiplier\" 要是 1 以上的數字";
      this.maxBonusMultiplier = bonus.max_total_multiplier;
      const tiers = "streak_tiers" in bonus ? bonus.streak_tiers : [];
      if (!Array.isArray(tiers)) return "\"streak_tiers\" 要是陣列";
      let previous = 0;
      for (let i = 0; i < tiers.length; i++) {
        const t = tiers[i];
        if (!isPlainObject(t)) return `streak_tiers[${i}] 要是物件`;
        if (!isWhole(t.min_streak) || t.min_streak < 1) return `streak_tiers[${i}].min_streak 要是 1 以上的整數`;
        if (t.min_streak <= previous) return `streak_tiers[${i}].min_streak 要比前一個大`;
        if (!isMultiplier(t.multiplier)) return `streak_tiers[${i}].multiplier 要是 1 以上的數字`;
        this.streakTiers.push({ minStreak: t.min_streak, multiplier: t.multiplier });
        previous = t.min_streak;
      }
      const byDifficulty = "difficulty_multipliers" in bonus ? bonus.difficulty_multipliers : [];
      if (!Array.isArray(byDifficulty)) return "\"difficulty_multipliers\" 要是陣列";
      for (let i = 0; i < byDifficulty.length; i++) {
        if (!isMultiplier(byDifficulty[i])) return `difficulty_multipliers[${i}] 要是 1 以上的數字`;
        this.difficultyMultipliers.push(byDifficulty[i]);
      }
      return "";
    }

    validateCard(entry) {
      if (!isPlainObject(entry)) return "不是物件";
      for (const f of ["id", "display_name", "base_strength"]) if (!(f in entry)) return `缺少欄位 "${f}"`;
      for (const f of ["id", "display_name"]) {
        if (typeof entry[f] !== "string") return `欄位 "${f}" 要是文字`;
        if (!entry[f].trim()) return `欄位 "${f}" 不能空白`;
      }
      if (this.cards.has(entry.id)) return `id 重複："${entry.id}"`;
      if (!isFiniteNumber(entry.base_strength) || entry.base_strength < 0) return `"base_strength" 要是 0 以上的數字（${entry.id}）`;
      return "";
    }

    getCard(id) { return this.cards.get(id) || null; }

    currentStreak() {
      let count = 0;
      for (let i = this.log.records.length - 1; i >= 0; i--) {
        if (!this.log.records[i].isCorrect) break;
        count++;
      }
      return count;
    }

    streakMultiplierFor(streak) {
      let m = 1;
      for (const t of this.streakTiers) if (streak >= t.minStreak) m = t.multiplier;
      return m;
    }

    difficultyMultiplierFor(difficulty) {
      if (this.difficultyMultipliers.length === 0) return 1;
      return this.difficultyMultipliers[clamp(difficulty - 1, 0, this.difficultyMultipliers.length - 1)];
    }

    static damageForStrength(strength) {
      if (!(strength > 0)) return 0;
      return Math.max(roundi(strength), 1);
    }

    static judge(question, choice) {
      if (!question || choice < 0 || choice >= question.options.length) return false;
      return question.options[choice] === question.correct;
    }

    // 判定一次作答並記錄；回傳 { ok, error, isCorrect, effectiveStrength, bonusMultiplier, ... }
    evaluate(question, cardId, choice) {
      if (!question) return { ok: false, error: "沒有題目" };
      const card = this.getCard(cardId);
      if (!card) return { ok: false, error: `不認得的卡牌 "${cardId}"` };
      const isCorrect = AnswerEffect.judge(question, choice);
      const record = {
        questionId: question.id, unit: question.unit, cardId, isCorrect,
        questionText: question.text, hint: question.hint, correctAnswer: question.correct,
        chosenAnswer: choice >= 0 && choice < question.options.length ? question.options[choice] : "",
      };
      this.log.append(record);
      const result = {
        ok: true, isCorrect, record, baseStrength: card.baseStrength, streak: this.currentStreak(),
        streakMultiplier: 1, difficultyMultiplier: 1, bonusMultiplier: 1, effectiveStrength: 0,
      };
      if (isCorrect) {
        result.streakMultiplier = this.streakMultiplierFor(result.streak);
        result.difficultyMultiplier = this.difficultyMultiplierFor(question.difficulty);
        result.bonusMultiplier = Math.min(result.streakMultiplier * result.difficultyMultiplier, this.maxBonusMultiplier);
        result.effectiveStrength = card.baseStrength * result.bonusMultiplier;
      } else {
        result.effectiveStrength = card.baseStrength * this.wrongMultiplier;
      }
      return result;
    }
  }

  // ---------- 牌組 ----------
  class Deck {
    constructor(rng) {
      this.rng = rng || makeRng();
      this.handSize = 0;
      this.composition = new Map();
      this.drawPile = [];
      this.hand = [];
      this.discardPile = [];
      this.reshuffleCount = 0;
    }

    loadFromText(text, effect) {
      const errors = [];
      this.handSize = 0;
      this.composition.clear();
      this.drawPile = []; this.hand = []; this.discardPile = [];
      const root = parseJson(text, errors);
      if (errors.length) return { loaded: 0, errors };
      if (!isPlainObject(root)) return { loaded: 0, errors: ["牌組最外層要是物件"] };
      if (!isWhole(root.hand_size) || root.hand_size < 1) errors.push("\"hand_size\" 要是 1 以上的整數");
      else this.handSize = root.hand_size;
      if (!isPlainObject(root.composition)) {
        errors.push("牌組要有 \"composition\" 物件");
        return { loaded: 0, errors };
      }
      for (const [id, copies] of Object.entries(root.composition)) {
        if (!effect || !effect.getCard(id)) { errors.push(`composition：不認得的卡牌 "${id}"（略過）`); continue; }
        if (!isWhole(copies) || copies < 1) { errors.push(`composition："${id}" 的張數要是 1 以上的整數（略過）`); continue; }
        this.composition.set(id, copies);
      }
      this.startRun();
      const loaded = this.totalCount();
      if (loaded === 0) errors.push("牌組沒有任何卡牌");
      return { loaded, errors };
    }

    startRun() {
      this.drawPile = []; this.hand = []; this.discardPile = [];
      this.reshuffleCount = 0;
      for (const [id, copies] of this.composition) for (let i = 0; i < copies; i++) this.drawPile.push(id);
      this.shuffle(this.drawPile);
    }

    drawToLimit() {
      let drawn = 0;
      while (this.hand.length < this.handSize) {
        if (this.drawPile.length === 0) {
          if (this.discardPile.length === 0) break;
          this.drawPile.push(...this.discardPile);
          this.discardPile = [];
          this.shuffle(this.drawPile);
          this.reshuffleCount++;
        }
        this.hand.push(this.drawPile.pop());
        drawn++;
      }
      return drawn;
    }

    takeFromHand(index) {
      if (index < 0 || index >= this.hand.length) return "";
      return this.hand.splice(index, 1)[0];
    }

    discard(id) { this.discardPile.push(id); }
    totalCount() { let t = 0; for (const c of this.composition.values()) t += c; return t; }

    shuffle(cards) {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = this.rng.randiRange(0, i);
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
    }
  }

  // ---------- 怪物波次與基地 ----------
  class WaveManager extends Emitter {
    constructor() {
      super();
      this.reset();
    }

    reset() {
      this.state = "invalid"; // invalid | running | won | lost
      this.base = null;
      this.route = [];
      this.cumulative = [];
      this.routeLength = 0;
      this.waves = [];
      this.spawnTimes = [];
      this.spawnWaves = [];
      this.nextSpawn = 0;
      this.elapsed = 0;
      this.monsters = [];
    }

    loadFromText(text) {
      const errors = [];
      this.reset();
      const d = parseJson(text, errors);
      if (errors.length) return { loaded: false, errors };
      if (!isPlainObject(d)) return { loaded: false, errors: ["波次檔最外層要是物件"] };
      let baseHp = 0;
      if (!isWhole(d.base_hp) || d.base_hp < 1) errors.push("\"base_hp\" 要是 1 以上的整數");
      else baseHp = d.base_hp;

      const points = [];
      if (!Array.isArray(d.route)) errors.push("\"route\" 要是 [x, y] 點的陣列");
      else if (d.route.length < 2) errors.push(`"route" 至少要 2 個點，只有 ${d.route.length} 個`);
      else {
        for (let i = 0; i < d.route.length; i++) {
          const p = d.route[i];
          if (!Array.isArray(p) || p.length !== 2 || !isNumber(p[0]) || !isNumber(p[1])) {
            errors.push(`route[${i}] 要是 [x, y] 數字`);
            break;
          }
          points.push({ x: p[0], y: p[1] });
        }
        if (points.length === d.route.length) {
          let len = 0;
          for (let i = 1; i < points.length; i++) len += dist(points[i - 1], points[i]);
          if (len <= 0) errors.push("\"route\" 總長度是 0");
        }
      }

      const specs = [];
      if (!Array.isArray(d.waves)) errors.push("\"waves\" 要是陣列");
      else if (d.waves.length === 0) errors.push("\"waves\" 至少要有一波");
      else {
        d.waves.forEach((w, i) => {
          if (!isPlainObject(w)) { errors.push(`waves[${i}] 不是物件`); return; }
          let ok = true;
          for (const f of ["count", "speed", "hp", "damage_to_base", "spawn_interval"]) {
            if (!isNumber(w[f])) { errors.push(`waves[${i}]："${f}" 要是數字`); ok = false; }
          }
          if ("delay_before" in w && !isNumber(w.delay_before)) { errors.push(`waves[${i}]："delay_before" 要是數字`); ok = false; }
          if (!ok) return;
          if (!isWhole(w.count) || w.count < 0) { errors.push(`waves[${i}]："count" 要是 0 以上的整數`); ok = false; }
          if (!(w.speed > 0)) { errors.push(`waves[${i}]："speed" 要大於 0`); ok = false; }
          if (!isWhole(w.hp) || w.hp < 1) { errors.push(`waves[${i}]："hp" 要是 1 以上的整數`); ok = false; }
          if (!isWhole(w.damage_to_base) || w.damage_to_base < 0) { errors.push(`waves[${i}]："damage_to_base" 要是 0 以上的整數`); ok = false; }
          if (w.spawn_interval < 0) { errors.push(`waves[${i}]："spawn_interval" 不能小於 0`); ok = false; }
          if ("delay_before" in w && w.delay_before < 0) { errors.push(`waves[${i}]："delay_before" 不能小於 0`); ok = false; }
          if (!ok) return;
          specs.push({
            count: w.count, speed: w.speed, hp: w.hp, damageToBase: w.damage_to_base,
            spawnInterval: w.spawn_interval, delayBefore: w.delay_before || 0,
          });
        });
      }
      if (errors.length) return { loaded: false, errors };

      this.base = { maxHp: baseHp, hp: baseHp };
      this.route = points;
      this.cumulative = [0];
      for (let i = 1; i < points.length; i++) this.cumulative.push(this.cumulative[i - 1] + dist(points[i - 1], points[i]));
      this.routeLength = this.cumulative[this.cumulative.length - 1];
      this.waves = specs;
      // 第 k 隻在 波次開始 + k × 間隔 出現；下一波從上一波最後一隻出現的時間 + delay_before 開始
      let start = 0;
      specs.forEach((s, w) => {
        start += s.delayBefore;
        for (let k = 0; k < s.count; k++) {
          this.spawnTimes.push(start + k * s.spawnInterval);
          this.spawnWaves.push(w);
        }
        if (s.count > 0) start += (s.count - 1) * s.spawnInterval;
      });
      this.state = "running";
      return { loaded: true, errors };
    }

    advance(dt) {
      if (this.state !== "running" || !(dt > 0)) return;
      const newTime = this.elapsed + dt;
      for (const m of this.monsters) m.distance += m.speed * dt;
      while (this.nextSpawn < this.spawnTimes.length && this.spawnTimes[this.nextSpawn] <= newTime) {
        this.spawn(this.spawnWaves[this.nextSpawn], newTime - this.spawnTimes[this.nextSpawn]);
        this.nextSpawn++;
      }
      this.elapsed = newTime;
      // 抵達基地的怪物依抵達先後扣血；基地被打掉後剩下的留在場上
      const arrived = this.monsters.filter((m) => m.distance >= this.routeLength);
      arrived.sort((a, b) => {
        const agoA = (a.distance - this.routeLength) / a.speed;
        const agoB = (b.distance - this.routeLength) / b.speed;
        if (agoA !== agoB) return agoB - agoA;
        return a.id - b.id;
      });
      for (const m of arrived) {
        if (this.base.hp <= 0) break;
        this.base.hp -= clamp(m.damageToBase, 0, this.base.hp);
        this.remove(m);
        this.emit("monsterReachedBase", m);
        this.emit("monsterRemoved", m);
      }
      for (const m of this.monsters) m.position = this.positionAt(m.distance);
      this.checkEnd();
    }

    damageMonster(m, amount) {
      if (this.state !== "running" || !m || !m.onField || amount <= 0) return false;
      m.hp = Math.max(m.hp - amount, 0);
      if (m.hp > 0) return false;
      this.remove(m);
      this.emit("monsterKilled", m);
      this.emit("monsterRemoved", m);
      this.checkEnd();
      return true;
    }

    positionAt(distance) {
      const r = this.route;
      if (r.length < 2) return { x: 0, y: 0 };
      const d = clamp(distance, 0, this.routeLength);
      for (let i = 1; i < r.length; i++) {
        if (d <= this.cumulative[i]) {
          const seg = this.cumulative[i] - this.cumulative[i - 1];
          if (seg <= 0) return { x: r[i].x, y: r[i].y };
          const t = (d - this.cumulative[i - 1]) / seg;
          return { x: r[i - 1].x + (r[i].x - r[i - 1].x) * t, y: r[i - 1].y + (r[i].y - r[i - 1].y) * t };
        }
      }
      return { x: r[r.length - 1].x, y: r[r.length - 1].y };
    }

    // 下一隻要出現的怪物屬於第幾波（0 起算）；全部出完後是最後一波
    currentWaveIndex() {
      if (this.spawnWaves.length === 0) return -1;
      return this.spawnWaves[Math.min(this.nextSpawn, this.spawnWaves.length - 1)];
    }

    totalSpawnCount() { return this.spawnTimes.length; }

    spawn(waveIndex, alreadyWalked) {
      const s = this.waves[waveIndex];
      const m = {
        id: this.nextSpawn, waveIndex, maxHp: s.hp, hp: s.hp, speed: s.speed,
        damageToBase: s.damageToBase, distance: s.speed * alreadyWalked, onField: true, position: null,
      };
      m.position = this.positionAt(m.distance);
      this.monsters.push(m);
      this.emit("monsterSpawned", m);
    }

    remove(m) {
      m.onField = false;
      this.monsters = this.monsters.filter((x) => x !== m);
    }

    checkEnd() {
      if (this.state !== "running") return;
      if (this.base.hp <= 0) {
        this.state = "lost";
        this.emit("runEnded", this.state);
      } else if (this.nextSpawn >= this.spawnTimes.length && this.monsters.length === 0) {
        this.state = "won";
        this.emit("runEnded", this.state);
      }
    }
  }

  function dist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }

  // ---------- 出牌與作答 ----------
  // 狀態：noTurn → choosing（選牌）→ answering（作答）→ choosing ...
  class HandController extends Emitter {
    constructor(deck, bank, effect, unit, difficulty = ANY_DIFFICULTY) {
      super();
      this.deck = deck; this.bank = bank; this.effect = effect;
      this.unit = unit; this.difficulty = difficulty;
      this.state = "noTurn";
      this.pendingCardId = "";
      this.pendingQuestion = null;
    }

    cardName(id) {
      const c = this.effect.getCard(id);
      return c ? c.displayName : id;
    }

    startTurn() {
      if (this.state === "answering") return this.reject("還有題目沒作答，不能補牌");
      if (this.deck.handSize < 1) return this.reject("手牌上限小於 1");
      this.deck.drawToLimit();
      if (this.deck.hand.length === 0) return this.reject("牌組沒有牌可以抽");
      this.state = "choosing";
      this.emit("handChanged");
      return { ok: true };
    }

    playCard(index) {
      if (this.state !== "choosing") return this.reject("現在不能出牌");
      const id = this.deck.hand[index];
      if (id === undefined) return this.reject(`手牌沒有第 ${index} 張`);
      if (!this.effect.getCard(id)) return this.reject(`不認得的卡牌 "${id}"`);
      let draw = this.bank.draw(this.unit, this.difficulty);
      if (draw.status === "exhausted") {
        this.bank.resetUnit(this.unit);
        draw = this.bank.draw(this.unit, this.difficulty);
      }
      if (draw.status !== "ok") return this.reject(`單元「${this.unit}」難度 ${this.difficulty} 沒有題目`);
      this.deck.takeFromHand(index);
      this.pendingCardId = id;
      this.pendingQuestion = draw.question;
      this.state = "answering";
      this.emit("handChanged");
      this.emit("questionPresented", id, draw.question);
      return { ok: true };
    }

    submitAnswer(option) {
      if (this.state !== "answering" || !this.pendingQuestion) return this.reject("沒有要作答的題目");
      if (option < 0 || option >= this.pendingQuestion.options.length) return this.reject(`沒有第 ${option} 個選項`);
      const evaluation = this.effect.evaluate(this.pendingQuestion, this.pendingCardId, option);
      if (!evaluation.ok) return this.reject(evaluation.error);
      const id = this.pendingCardId, q = this.pendingQuestion;
      this.deck.discard(id);
      this.pendingCardId = "";
      this.pendingQuestion = null;
      this.state = "choosing";
      this.emit("handChanged");
      this.emit("answerResolved", id, q, evaluation);
      return { ok: true, evaluation };
    }

    reject(message) {
      this.emit("actionRejected", message);
      return { ok: false, message };
    }
  }

  // ---------- 關卡設定 ----------
  const DEFAULT_SLOW = 0.3, DEFAULT_STAR_BASE = 50, DEFAULT_STAR_ACC = 80;
  const LEVEL_PATH_FIELDS = ["questions_path", "card_effects_path", "deck_path", "waves_path"];

  function parseLevels(text) {
    const errors = [];
    const levels = [];
    const data = parseJson(text, errors);
    if (!errors.length && (!isPlainObject(data) || !Array.isArray(data.levels))) errors.push("關卡檔最外層要有 \"levels\" 陣列");
    if (errors.length) return { levels, errors: errors.concat("沒有可用的關卡") };
    const seen = new Set();
    data.levels.forEach((e, i) => {
      const problem = validateLevel(e, seen);
      if (problem) { errors.push(`levels[${i}]：${problem}（略過）`); return; }
      seen.add(e.id);
      levels.push({
        id: e.id, displayName: e.display_name, unit: e.unit,
        questionsPath: e.questions_path, cardEffectsPath: e.card_effects_path,
        deckPath: e.deck_path, wavesPath: e.waves_path,
        playCooldownSeconds: e.play_cooldown_seconds,
        waveDifficulty: e.wave_difficulty.slice(),
        answerSlowTimeScale: "answer_slow_time_scale" in e ? e.answer_slow_time_scale : DEFAULT_SLOW,
        starBaseHpPercent: "star_base_hp_percent" in e ? e.star_base_hp_percent : DEFAULT_STAR_BASE,
        starAccuracyPercent: "star_accuracy_percent" in e ? e.star_accuracy_percent : DEFAULT_STAR_ACC,
      });
    });
    if (levels.length === 0) errors.push("沒有可用的關卡");
    return { levels, errors };
  }

  function validateLevel(e, seen) {
    if (!isPlainObject(e)) return "不是物件";
    for (const f of ["id", "display_name", "unit", ...LEVEL_PATH_FIELDS]) {
      if (!(f in e)) return `缺少欄位 "${f}"`;
      if (typeof e[f] !== "string") return `欄位 "${f}" 要是文字`;
      if (!e[f].trim()) return `欄位 "${f}" 不能空白`;
    }
    if (seen.has(e.id)) return `id 重複："${e.id}"`;
    if (!("play_cooldown_seconds" in e)) return "缺少欄位 \"play_cooldown_seconds\"";
    if (!isFiniteNumber(e.play_cooldown_seconds) || e.play_cooldown_seconds < 0) return "\"play_cooldown_seconds\" 要是 0 以上的數字";
    if (!Array.isArray(e.wave_difficulty)) return "\"wave_difficulty\" 要是整數陣列";
    if (e.wave_difficulty.length === 0) return "\"wave_difficulty\" 不能是空的";
    if (e.wave_difficulty.some((v) => !isWhole(v) || v < 1)) return "\"wave_difficulty\" 只能放 1 以上的整數";
    if ("answer_slow_time_scale" in e) {
      const s = e.answer_slow_time_scale;
      if (!isNumber(s)) return "\"answer_slow_time_scale\" 要是數字";
      if (s < 0 || s > 1) return "\"answer_slow_time_scale\" 要在 0 到 1 之間";
    }
    for (const f of ["star_base_hp_percent", "star_accuracy_percent"]) {
      if (f in e && (!isWhole(e[f]) || e[f] < 0 || e[f] > 100)) return `"${f}" 要是 0 到 100 的整數`;
    }
    return "";
  }

  function difficultyForWave(table, waveIndex) {
    if (!table.length) return ANY_DIFFICULTY;
    return table[clamp(waveIndex, 0, table.length - 1)];
  }

  // ---------- 一局 ----------
  // 作答時怪物的速度：stop 停止、slow 變慢、normal 挑戰
  const PACES = ["stop", "slow", "normal"];

  class GameSession extends Emitter {
    constructor(manager, controller, effect, level) {
      super();
      this.manager = manager; this.controller = controller; this.effect = effect; this.level = level;
      this.cooldownRemaining = 0;
      this.handLocked = false;
      this.ended = false;
      this.pace = "stop";
      this.allAnsweringInChallenge = true;
      controller.unit = level.unit;
      this.applyDifficulty();
      controller.on("answerResolved", (id, q, r) => this.onAnswerResolved(r));
      controller.on("questionPresented", () => { if (this.pace !== "normal") this.allAnsweringInChallenge = false; });
      manager.on("runEnded", (state) => {
        if (this.ended) return;
        this.ended = true;
        this.emit("sessionEnded", state);
      });
    }

    // loadText(路徑) 回傳該資料檔的文字（找不到回傳 null）
    static build(level, rng, loadText) {
      const errors = [];
      const read = (path, label) => {
        const text = loadText(path);
        if (text === null || text === undefined) errors.push(`找不到${label}：${path}`);
        return text;
      };
      const manager = new WaveManager();
      const bank = new QuestionBank(rng);
      const effect = new AnswerEffect();
      const deck = new Deck(rng);
      const wavesText = read(level.wavesPath, "波次檔");
      if (wavesText != null) errors.push(...manager.loadFromText(wavesText).errors);
      const qText = read(level.questionsPath, "題庫");
      if (qText != null) errors.push(...bank.loadFromText(qText).errors);
      const eText = read(level.cardEffectsPath, "卡牌效果檔");
      if (eText != null) errors.push(...effect.loadFromText(eText).errors);
      const dText = read(level.deckPath, "牌組檔");
      if (dText != null) errors.push(...deck.loadFromText(dText, effect).errors);
      if (manager.state !== "running") return { session: null, errors };
      if (effect.cards.size === 0 || deck.totalCount() === 0 || deck.handSize < 1) return { session: null, errors };
      if (bank.unitQuestionCount(level.unit) === 0) {
        errors.push(`單元「${level.unit}」沒有題目`);
        return { session: null, errors };
      }
      const controller = new HandController(deck, bank, effect, level.unit);
      return { session: new GameSession(manager, controller, effect, level), errors };
    }

    start() {
      this.applyDifficulty();
      return this.controller.startTurn();
    }

    advance(dt) {
      if (this.ended || !(dt > 0)) return;
      if (this.isWaitingForAnswer()) {
        const scaled = dt * this.answerTimeScale();
        if (scaled > 0) {
          this.manager.advance(scaled);
          if (!this.ended) this.applyDifficulty();
        }
        return;
      }
      this.manager.advance(dt);
      if (this.ended) return;
      this.applyDifficulty();
      if (this.handLocked) {
        this.cooldownRemaining = Math.max(this.cooldownRemaining - dt, 0);
        if (this.cooldownRemaining <= 0) this.setHandLocked(false);
      }
    }

    // 離基地最近的怪物（走最遠；一樣遠取先出現的）
    pickTarget() {
      let best = null;
      for (const m of this.manager.monsters) if (!best || m.distance > best.distance) best = m;
      return best;
    }

    isWaitingForAnswer() { return this.controller.state === "answering"; }

    setPace(pace) {
      if (!PACES.includes(pace) || pace === this.pace) return;
      this.pace = pace;
      if (this.isWaitingForAnswer() && pace !== "normal") this.allAnsweringInChallenge = false;
      this.emit("paceChanged", pace);
    }

    // 挑戰成績：至少答一題，而且每一題作答時都是挑戰模式
    isChallengeRun() { return this.allAnsweringInChallenge && this.effect.log.totalCount() > 0; }

    answerTimeScale() {
      if (this.pace === "slow") return this.level.answerSlowTimeScale;
      if (this.pace === "normal") return 1;
      return 0;
    }

    currentStreak() { return this.effect.currentStreak(); }
    currentStreakMultiplier() { return this.effect.streakMultiplierFor(this.currentStreak()); }
    get log() { return this.effect.log; }

    applyDifficulty() {
      this.controller.difficulty = difficultyForWave(this.level.waveDifficulty, this.manager.currentWaveIndex());
    }

    setHandLocked(locked) {
      if (this.handLocked === locked) return;
      this.handLocked = locked;
      this.emit("handLockChanged", locked);
    }

    onAnswerResolved(result) {
      if (this.ended) return;
      const amount = AnswerEffect.damageForStrength(result.effectiveStrength);
      const target = this.pickTarget();
      if (target && amount > 0) {
        const killed = this.manager.damageMonster(target, amount);
        this.emit("damageApplied", target, amount, killed, result.bonusMultiplier > 1);
      }
      if (this.ended) return;
      if (this.level.playCooldownSeconds > 0) {
        this.cooldownRemaining = this.level.playCooldownSeconds;
        this.setHandLocked(true);
      }
      this.applyDifficulty();
      this.controller.startTurn();
    }
  }

  // ---------- 結算 ----------
  // 四捨五入的整數百分比（和 Godot 版相同的整數算法）
  function percentOf(part, whole) {
    if (whole <= 0) return 0;
    return Math.floor((part * 200 + whole) / (whole * 2));
  }

  function buildSummary(log, finalState) {
    const s = {
      won: finalState === "won", total: 0, correct: 0, hasAnswers: false, accuracyPercent: 0,
      wrongUnits: [], maxStreak: 0, wrongQuestions: [],
    };
    if (!log) return s;
    s.total = log.totalCount();
    s.correct = log.correctCount();
    s.hasAnswers = s.total > 0;
    s.maxStreak = log.maxStreak();
    const listed = new Set();
    for (const r of log.records) {
      if (r.isCorrect || listed.has(r.questionId)) continue;
      listed.add(r.questionId);
      s.wrongQuestions.push({ questionId: r.questionId, text: r.questionText, hint: r.hint, correctAnswer: r.correctAnswer, chosenAnswer: r.chosenAnswer });
    }
    if (s.hasAnswers) s.accuracyPercent = percentOf(s.correct, s.total);
    for (const unit of log.units()) {
      const total = log.unitTotal(unit);
      const wrong = total - log.unitCorrect(unit);
      if (wrong > 0) s.wrongUnits.push({ unit, wrong, total });
    }
    // 答錯多的排前面；一樣多時保持原順序（穩定排序）
    s.wrongUnits = s.wrongUnits.map((u, i) => [u, i]).sort((a, b) => b[0].wrong - a[0].wrong || a[1] - b[1]).map((x) => x[0]);
    return s;
  }

  const MAX_STARS = 3;

  function buildStarRating(summary, hp, maxHp, baseThreshold, accuracyThreshold, challenge) {
    const r = {
      won: summary.won, baseHp: Math.max(hp, 0), baseMaxHp: Math.max(maxHp, 0),
      baseThresholdPercent: baseThreshold, accuracyThresholdPercent: accuracyThreshold,
      hasAnswers: summary.hasAnswers, accuracyPercent: summary.accuracyPercent,
      maxStreak: summary.maxStreak, challenge, stars: 0,
    };
    r.baseOk = r.baseMaxHp > 0 && r.baseHp * 100 >= r.baseMaxHp * baseThreshold;
    r.accuracyOk = summary.hasAnswers && summary.accuracyPercent >= accuracyThreshold;
    if (r.won) r.stars = 1 + (r.baseOk ? 1 : 0) + (r.accuracyOk ? 1 : 0);
    return r;
  }

  function starsText(count) {
    const filled = clamp(count, 0, MAX_STARS);
    return "★".repeat(filled) + "☆".repeat(MAX_STARS - filled);
  }

  // ---------- 存檔：各關最佳星等 ----------
  const SAVE_VERSION = 1;
  const isCountLike = (v) => isWhole(v) && Math.abs(v) <= 1000;

  class StarStore {
    constructor() { this.levels = {}; this.loadError = ""; }

    best(levelId, challenge) {
      const e = this.levels[levelId];
      return e ? e[challenge ? "challenge" : "normal"] : 0;
    }

    // 比原本高才記；回傳是否破紀錄
    record(levelId, challenge, stars) {
      const value = clamp(stars, 0, MAX_STARS);
      if (!levelId || value <= this.best(levelId, challenge)) return false;
      const e = this.levels[levelId] || { normal: 0, challenge: 0 };
      e[challenge ? "challenge" : "normal"] = value;
      this.levels[levelId] = e;
      return true;
    }

    toText() { return JSON.stringify({ version: SAVE_VERSION, levels: this.levels }); }

    loadFromText(text) {
      this.levels = {};
      this.loadError = "";
      if (text === null || text === undefined) return true;
      const fail = (m) => { this.levels = {}; this.loadError = m; return false; };
      let root;
      try { root = JSON.parse(text); } catch (e) { return fail("不是正確的 JSON"); }
      if (!isPlainObject(root)) return fail("最外層不是物件");
      if (!isCountLike(root.version) || root.version !== SAVE_VERSION) return fail("版本不符");
      if (!isPlainObject(root.levels)) return fail("levels 不是物件");
      const out = {};
      for (const [id, e] of Object.entries(root.levels)) {
        if (!id) return fail("有關卡沒有 id");
        if (!isPlainObject(e)) return fail(`關卡 ${id} 不是物件`);
        const parsed = {};
        for (const f of ["normal", "challenge"]) {
          const v = f in e ? e[f] : 0;
          if (!isCountLike(v) || v < 0 || v > MAX_STARS) return fail(`關卡 ${id} 的 ${f} 要是 0 到 3 的整數`);
          parsed[f] = v;
        }
        out[id] = parsed;
      }
      this.levels = out;
      return true;
    }
  }

  // ---------- 存檔：教師檢視（各單元累計）----------
  const MAX_COUNT = 1000000000;

  class ProgressStore {
    constructor() { this.units = {}; this.loadError = ""; }

    addRun(log) {
      if (!log) return;
      for (const unit of log.units()) {
        const total = log.unitTotal(unit);
        const correct = Math.min(log.unitCorrect(unit), total);
        if (total <= 0) continue;
        const e = this.units[unit] || { total: 0, correct: 0 };
        e.total += total;
        e.correct += correct;
        this.units[unit] = e;
      }
    }

    clear() { this.units = {}; this.loadError = ""; }
    isEmpty() { return Object.keys(this.units).length === 0; }

    // 答對率由低到高；一樣時依單元名稱
    stats() {
      return Object.entries(this.units)
        .map(([unit, e]) => ({ unit, total: e.total, correct: e.correct, percent: percentOf(e.correct, e.total) }))
        .sort((a, b) => a.percent - b.percent || (a.unit < b.unit ? -1 : a.unit > b.unit ? 1 : 0));
    }

    // 至少兩個單元、而且答對率不全相同，才標出最低的
    lowestUnits() {
      const answered = this.stats().filter((s) => s.total > 0);
      if (answered.length < 2) return [];
      const min = answered[0].percent;
      if (answered[answered.length - 1].percent === min) return [];
      return answered.filter((s) => s.percent === min).map((s) => s.unit);
    }

    toText() {
      return JSON.stringify({ version: SAVE_VERSION, students: { default: { units: this.units } } });
    }

    loadFromText(text) {
      this.clear();
      if (text === null || text === undefined) return true;
      const fail = (m) => { this.units = {}; this.loadError = m; return false; };
      let root;
      try { root = JSON.parse(text); } catch (e) { return fail("不是正確的 JSON"); }
      if (!isPlainObject(root)) return fail("最外層不是物件");
      if (!isWhole(root.version) || root.version !== SAVE_VERSION) return fail("版本不符");
      if (!isPlainObject(root.students)) return fail("students 不是物件");
      const student = root.students.default;
      if (!isPlainObject(student)) return fail("沒有 default 學生");
      if (!isPlainObject(student.units)) return fail("units 不是物件");
      const out = {};
      const isCount = (v) => isWhole(v) && v >= 0 && v <= MAX_COUNT;
      for (const [unit, e] of Object.entries(student.units)) {
        if (!unit) return fail("有單元沒有名稱");
        if (!isPlainObject(e)) return fail(`單元 ${unit} 不是物件`);
        if (!isCount(e.total) || !isCount(e.correct)) return fail(`單元 ${unit} 的數量要是整數`);
        if (e.correct > e.total) return fail(`單元 ${unit} 答對數大於作答數`);
        out[unit] = { total: e.total, correct: e.correct };
      }
      this.units = out;
      return true;
    }
  }

  return {
    makeRng, roundi, percentOf, ANY_DIFFICULTY, PACES, MAX_STARS,
    QuestionBank, AnswerLog, AnswerEffect, Deck, WaveManager, HandController,
    parseLevels, difficultyForWave, GameSession, buildSummary, buildStarRating, starsText,
    StarStore, ProgressStore,
  };
})();
</script>
<script id="ui">
// ===== 畫面 =====
(() => {
  "use strict";
  const L = Logic;
  const $ = (id) => document.getElementById(id);

  // ---------- 資料與存檔 ----------
  // 關卡設定裡的資料路徑只看檔名，對應本檔上方 data-file 相同的資料區塊
  function dataText(path) {
    const name = String(path).split("/").pop();
    for (const el of document.querySelectorAll('script[type="application/json"][data-file]')) {
      if (el.dataset.file === name) return el.textContent;
    }
    return null;
  }

  const KEYS = { stars: "formula-guard.stars", progress: "formula-guard.progress", pace: "formula-guard.pace" };
  const storage = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { return false; } },
  };

  const starStore = new L.StarStore();
  starStore.loadFromText(storage.get(KEYS.stars));
  const progressStore = new L.ProgressStore();
  progressStore.loadFromText(storage.get(KEYS.progress));
  let progressSaveFailed = false;
  let preferredPace = L.PACES.includes(storage.get(KEYS.pace)) ? storage.get(KEYS.pace) : "stop";

  const catalog = (() => {
    const text = dataText("levels.json");
    return text === null ? { levels: [], errors: ["找不到關卡設定 levels.json", "沒有可用的關卡"] } : L.parseLevels(text);
  })();

  // ---------- 小工具 ----------
  function el(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") node.className = v;
      else if (k === "onclick") node.addEventListener("click", v);
      else node.setAttribute(k, v);
    }
    for (const c of children) if (c !== null && c !== undefined) node.append(c);
    return node;
  }

  function formatTime(seconds) {
    const s = Math.floor(seconds);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }

  function showScreen(name) {
    for (const s of document.querySelectorAll(".screen")) s.hidden = s.id !== "screen-" + name;
  }

  // ---------- 選關 ----------
  function showLevelSelect() {
    stopGame();
    const list = $("level-list");
    list.replaceChildren();
    for (const level of catalog.levels) {
      list.append(el("div", { class: "level-row" },
        el("button", { class: "level-button", onclick: () => startLevel(level) }, level.displayName),
        el("div", { class: "level-stars" },
          `一般 ${L.starsText(starStore.best(level.id, false))}　挑戰 ${L.starsText(starStore.best(level.id, true))}`)));
    }
    const errors = $("level-errors");
    errors.textContent = catalog.errors.join("\n");
    errors.hidden = catalog.errors.length === 0;
    showScreen("select");
  }

  // ---------- 教師檢視 ----------
  function showTeacherView() {
    $("confirm-box").hidden = true;
    $("btn-clear").hidden = false;
    renderTeacherView();
    showScreen("teacher");
  }

  function renderTeacherView() {
    const body = $("teacher-rows");
    body.replaceChildren();
    const lowest = progressStore.lowestUnits();
    for (const s of progressStore.stats()) {
      const isLowest = lowest.includes(s.unit);
      body.append(el("tr", { class: isLowest ? "lowest" : "" },
        el("td", { class: "marker" }, isLowest ? "最低" : ""),
        el("td", {}, s.unit),
        el("td", { class: "num" }, String(s.total)),
        el("td", { class: "num" }, s.percent + "%")));
    }
    const hasData = !progressStore.isEmpty();
    $("teacher-table").hidden = !hasData;
    $("teacher-empty").hidden = hasData;
    $("btn-clear").disabled = !hasData;
    const notes = [];
    if (progressStore.loadError) notes.push("存檔損毀或格式不符，已改用空資料重新開始");
    if (progressSaveFailed) notes.push("無法儲存資料（瀏覽器不允許存檔）");
    $("teacher-notice").textContent = notes.join("\n");
    $("teacher-notice").hidden = notes.length === 0;
  }

  $("btn-teacher").addEventListener("click", showTeacherView);
  $("btn-teacher-back").addEventListener("click", showLevelSelect);
  $("btn-clear").addEventListener("click", () => { $("btn-clear").hidden = true; $("confirm-box").hidden = false; });
  $("btn-confirm-no").addEventListener("click", () => { $("confirm-box").hidden = true; $("btn-clear").hidden = false; });
  $("btn-confirm-yes").addEventListener("click", () => {
    progressStore.clear();
    progressSaveFailed = !storage.set(KEYS.progress, progressStore.toText());
    $("confirm-box").hidden = true;
    $("btn-clear").hidden = false;
    renderTeacherView();
  });

  // ---------- 一局 ----------
  let G = null; // 目前這一局

  function startLevel(level) {
    stopGame();
    const built = L.GameSession.build(level, L.makeRng(), dataText);
    for (const m of built.errors) console.warn("公式守衛：", m);
    G = {
      level, session: built.session, paused: false, last: 0, raf: 0,
      hits: [], flashes: new Map(), feedback: { text: "", kind: "" }, question: null, recorded: false,
    };
    $("results").hidden = true;
    $("pause-overlay").hidden = true;
    showScreen("game");
    fitField();
    if (!G.session) {
      $("pace-bar").hidden = true;
      showDataError(built.errors);
      return;
    }
    $("pace-bar").hidden = false;
    const s = G.session, c = s.controller;
    c.on("handChanged", renderHand);
    c.on("questionPresented", (cardId, q) => {
      G.question = { cardName: c.cardName(cardId), question: q, answered: false };
      setFeedback("請選擇答案", "");
      renderQuestion();
      renderOverlay();
    });
    c.on("answerResolved", (cardId, q, r) => {
      if (G.question) G.question.answered = true;
      renderQuestion();
      if (r.isCorrect && r.bonusMultiplier > 1) {
        const dealt = L.AnswerEffect.damageForStrength(r.effectiveStrength);
        setFeedback(`答對，效果強度 ${dealt}（加成 +${L.roundi((r.bonusMultiplier - 1) * 100)}%）`, "good");
      } else if (r.isCorrect) {
        setFeedback(`答對，效果強度 ${formatStrength(r.effectiveStrength)}`, "good");
      } else if (r.effectiveStrength > 0) {
        setFeedback(`答錯，效果強度減弱為 ${formatStrength(r.effectiveStrength)}`, "bad");
      } else {
        setFeedback("答錯，沒有打到怪物", "bad");
      }
      renderOverlay();
    });
    c.on("actionRejected", (message) => setFeedback(message, "warn"));
    s.on("handLockChanged", renderHand);
    s.on("paceChanged", (pace) => {
      preferredPace = pace;
      storage.set(KEYS.pace, pace);
      renderPace();
      renderOverlay();
    });
    s.on("damageApplied", (m, amount, killed, boosted) => {
      G.hits.push({ x: m.position.x, y: m.position.y, text: String(amount), boosted, age: 0 });
      if (!killed) G.flashes.set(m.id, 1);
    });
    s.on("sessionEnded", onSessionEnded);
    s.setPace(preferredPace);
    renderPace();
    setFeedback("請選一張卡牌打出", "");
    renderQuestion();
    s.start();
    renderOverlay();
    G.raf = requestAnimationFrame(frame);
  }

  function stopGame() {
    if (G && G.raf) cancelAnimationFrame(G.raf);
    G = null;
  }

  function formatStrength(v) {
    return Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(1);
  }

  function frame(now) {
    if (!G) return;
    const dt = G.last ? Math.min((now - G.last) / 1000, 0.25) : 0;
    G.last = now;
    const s = G.session;
    if (!G.paused && !s.ended) s.advance(dt);
    // 傷害數字與受擊閃爍用真實時間播放（暫停時也會播完）
    for (const h of G.hits) h.age += dt;
    G.hits = G.hits.filter((h) => h.age < HIT_SECONDS);
    for (const [id, v] of G.flashes) {
      const nv = v - dt / FLASH_SECONDS;
      if (nv <= 0) G.flashes.delete(id); else G.flashes.set(id, nv);
    }
    renderHud();
    draw();
    G.raf = requestAnimationFrame(frame);
  }

  // ---------- 手牌、題目、回饋 ----------
  function renderHand() {
    if (!G || !G.session) return;
    const s = G.session, c = s.controller;
    const canPlay = c.state === "choosing" && !s.handLocked && !s.ended;
    const hand = $("hand");
    hand.replaceChildren();
    c.deck.hand.forEach((id, i) => {
      const b = el("button", { class: "card card-" + id, onclick: () => { if (G && G.session === s) c.playCard(i); } }, c.cardName(id));
      b.disabled = !canPlay;
      hand.append(b);
    });
    hand.classList.toggle("locked", s.handLocked && !s.ended);
  }

  function renderQuestion() {
    const box = $("question"), opts = $("options");
    opts.replaceChildren();
    if (!G || !G.question) {
      box.textContent = "";
      box.hidden = true;
      opts.hidden = true;
      return;
    }
    const { cardName, question, answered } = G.question;
    box.hidden = false;
    opts.hidden = false;
    box.textContent = `${cardName}：${question.text}`;
    const s = G.session;
    question.options.forEach((text, i) => {
      const b = el("button", { class: "option", onclick: () => { if (G && G.session === s) s.controller.submitAnswer(i); } }, text);
      b.disabled = answered || s.ended;
      opts.append(b);
    });
  }

  function setFeedback(text, kind) {
    const f = $("feedback");
    f.textContent = text;
    f.className = "feedback " + kind;
  }

  function renderPace() {
    for (const b of document.querySelectorAll("#pace-bar [data-pace]")) {
      const on = G && G.session && b.dataset.pace === G.session.pace;
      b.classList.toggle("on", !!on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    }
  }

  for (const b of document.querySelectorAll("#pace-bar [data-pace]")) {
    b.addEventListener("click", () => { if (G && G.session && !G.session.ended) G.session.setPace(b.dataset.pace); });
  }

  function renderOverlay() {
    const s = G && G.session;
    const visible = !!s && !s.ended && s.isWaitingForAnswer();
    $("answer-overlay").hidden = !visible;
    if (!s) return;
    $("overlay-sub").textContent =
      s.pace === "slow" ? `怪物慢速前進（${Math.round(s.answerTimeScale() * 100) / 100} 倍）`
        : s.pace === "normal" ? "挑戰模式：怪物正常前進" : "怪物停止";
  }

  function renderHud() {
    const s = G && G.session;
    if (!s) return;
    const m = s.manager;
    $("hud-wave").textContent = `第 ${m.currentWaveIndex() + 1}/${m.waves.length} 波`;
    $("hud-time").textContent = "時間 " + formatTime(m.elapsed);
    const streak = s.currentStreak();
    const combo = $("hud-combo");
    combo.hidden = !(streak >= 1 && !s.ended);
    const percent = L.roundi((s.currentStreakMultiplier() - 1) * 100);
    combo.textContent = percent > 0 ? `連對 ${streak}（+${percent}%）` : `連對 ${streak}`;
    combo.classList.toggle("boosted", percent > 0);
  }

  // ---------- 暫停 ----------
  function pause() {
    if (!G || !G.session || G.session.ended || G.paused) return;
    G.paused = true;
    $("pause-overlay").hidden = false;
  }

  function resume() {
    if (!G) return;
    G.paused = false;
    G.last = 0;
    $("pause-overlay").hidden = true;
  }

  $("btn-pause").addEventListener("click", pause);
  $("btn-resume").addEventListener("click", resume);
  $("btn-pause-quit").addEventListener("click", showLevelSelect);
  // 切到別的分頁或 App 時自動暫停
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

  // ---------- 結算 ----------
  function onSessionEnded(finalState) {
    const s = G.session;
    renderHand();
    renderQuestion();
    renderOverlay();
    $("pace-bar").hidden = true;
    const summary = L.buildSummary(s.log, finalState);
    const base = s.manager.base;
    const rating = L.buildStarRating(summary, base.hp, base.maxHp, G.level.starBaseHpPercent,
      G.level.starAccuracyPercent, s.isChallengeRun());
    let newBest = false;
    if (!G.recorded) {
      G.recorded = true;
      newBest = starStore.record(G.level.id, rating.challenge, rating.stars);
      if (newBest) storage.set(KEYS.stars, starStore.toText());
      progressStore.addRun(s.log);
      progressSaveFailed = !storage.set(KEYS.progress, progressStore.toText());
    }
    showResults(summary, rating, newBest, s.manager.elapsed);
  }

  function showResults(summary, rating, newBest, elapsed) {
    const head = $("res-headline");
    head.textContent = summary.won ? "勝利" : "失敗";
    head.className = "headline " + (summary.won ? "good" : "bad");
    $("res-accuracy").textContent =
      (summary.hasAnswers ? `答對 ${summary.correct}/${summary.total}（${summary.accuracyPercent}%）` : "無作答") +
      "　用時 " + formatTime(elapsed);
    $("res-stars").hidden = false;
    $("res-stars").textContent = `${L.starsText(rating.stars)}　${rating.challenge ? "挑戰模式" : "一般模式"}` + (newBest ? "　新紀錄！" : "");
    const mark = (ok) => (ok ? "★" : "☆");
    const lines = [];
    if (rating.won) {
      lines.push(`${mark(true)} 過關`);
      lines.push(`${mark(rating.baseOk)} 基地血量 ${rating.baseThresholdPercent}% 以上（剩 ${rating.baseHp}/${rating.baseMaxHp}）`);
      lines.push(rating.hasAnswers
        ? `${mark(rating.accuracyOk)} 答對率 ${rating.accuracyThresholdPercent}% 以上（${rating.accuracyPercent}%）`
        : `${mark(false)} 答對率 ${rating.accuracyThresholdPercent}% 以上（無作答）`);
    }
    lines.push(`最高連對 ${rating.maxStreak}`);
    $("res-detail").hidden = false;
    $("res-detail").textContent = lines.join("\n");

    const units = $("res-units");
    units.replaceChildren(...summary.wrongUnits.map((u) => el("li", {}, `${u.unit}：答錯 ${u.wrong} 題（共 ${u.total} 題）`)));
    $("res-units-box").hidden = summary.wrongUnits.length === 0;
    $("res-all-correct").hidden = !(summary.hasAnswers && summary.wrongUnits.length === 0);

    const review = $("res-review");
    review.replaceChildren();
    summary.wrongQuestions.forEach((q, i) => {
      const answer = el("div", { class: "answer" });
      if (q.chosenAnswer) answer.append(el("span", { class: "chosen" }, `你的答案：${q.chosenAnswer}`));
      answer.append(el("span", { class: "correct" }, `正確答案：${q.correctAnswer}`));
      answer.hidden = true;
      const reveal = el("button", { class: "reveal" }, "想好了，看答案");
      reveal.addEventListener("click", () => { reveal.hidden = true; answer.hidden = false; });
      review.append(el("li", {},
        el("div", { class: "q" }, `${i + 1}. ${q.text}`),
        q.hint ? el("div", { class: "hint" }, `提示：${q.hint}`) : null,
        reveal, answer));
    });
    $("res-review-box").hidden = summary.wrongQuestions.length === 0;
    $("results-panel").classList.toggle("narrow", summary.wrongQuestions.length === 0);
    $("btn-again").hidden = false;
    $("results").hidden = false;
    $("results-panel").scrollTop = 0;
  }

  function showDataError(errors) {
    const head = $("res-headline");
    head.textContent = "資料錯誤";
    head.className = "headline bad";
    $("res-accuracy").textContent = errors.join("\n");
    $("res-stars").hidden = true;
    $("res-detail").hidden = true;
    $("res-units-box").hidden = true;
    $("res-all-correct").hidden = true;
    $("res-review-box").hidden = true;
    $("results-panel").classList.add("narrow");
    $("btn-again").hidden = true;
    $("results").hidden = false;
  }

  $("btn-again").addEventListener("click", () => { if (G) startLevel(G.level); });
  $("btn-results-back").addEventListener("click", showLevelSelect);

  // ---------- 戰場 ----------
  const VIEW = { x: 0, y: 20, w: 560, h: 520 }; // 路線座標的可見範圍（Godot 版的畫面像素）
  const COLORS = {
    background: "#212b33", route: "#73664d", start: "#4dcc66", base: "#408cf2", baseDown: "#666666",
    waves: ["#f28c33", "#d94d80", "#9959e6"], barBack: "#333333", barFill: "#4de64d",
    hit: "#ffe64d", hitBoosted: "#ff8c26", hitOutline: "#1a0d00",
  };
  const ROUTE_WIDTH = 28, BASE_HALF = 26, MONSTER_RADIUS = 14, BAR_W = 32, BAR_H = 5;
  const HIT_SECONDS = 0.9, HIT_RISE = 48, FLASH_SECONDS = 0.25;
  const FONT = '"GameTC", "GameLatin", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif';
  const canvas = $("field");
  const ctx = canvas.getContext("2d");
  let scale = 1;

  function fitField() {
    const wrap = $("field-wrap");
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    scale = Math.min(w / VIEW.w, h / VIEW.h);
    const cssW = Math.floor(VIEW.w * scale), cssH = Math.floor(VIEW.h * scale);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    draw();
  }
  new ResizeObserver(fitField).observe($("field-wrap"));

  function mix(hex, t) {
    const n = parseInt(hex.slice(1), 16);
    const ch = (shift) => Math.round(((n >> shift) & 255) + (255 - ((n >> shift) & 255)) * t);
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = COLORS.background;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!G || !G.session) return;
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, -VIEW.x * scale * dpr, -VIEW.y * scale * dpr);
    const m = G.session.manager;
    const pts = m.route;
    // 路線
    ctx.strokeStyle = COLORS.route;
    ctx.lineWidth = ROUTE_WIDTH;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.beginPath();
    pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.stroke();
    ctx.fillStyle = COLORS.start;
    ctx.beginPath();
    ctx.arc(pts[0].x, pts[0].y, 10, 0, Math.PI * 2);
    ctx.fill();
    // 基地
    const b = pts[pts.length - 1];
    ctx.fillStyle = m.base.hp > 0 ? COLORS.base : COLORS.baseDown;
    ctx.fillRect(b.x - BASE_HALF, b.y - BASE_HALF, BASE_HALF * 2, BASE_HALF * 2);
    ctx.font = `20px ${FONT}`;
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(`基地 ${m.base.hp}/${m.base.maxHp}`, b.x, b.y + BASE_HALF + 6);
    // 怪物
    for (const mon of m.monsters) {
      const { x, y } = mon.position;
      const color = COLORS.waves[mon.waveIndex % COLORS.waves.length];
      ctx.fillStyle = mix(color, G.flashes.get(mon.id) || 0);
      ctx.beginPath();
      ctx.arc(x, y, MONSTER_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      const left = x - BAR_W / 2, top = y - MONSTER_RADIUS - 10;
      ctx.fillStyle = COLORS.barBack;
      ctx.fillRect(left, top, BAR_W, BAR_H);
      ctx.fillStyle = COLORS.barFill;
      ctx.fillRect(left, top, BAR_W * (mon.hp / Math.max(mon.maxHp, 1)), BAR_H);
    }
    // 傷害數字
    ctx.textBaseline = "alphabetic";
    ctx.lineJoin = "round";
    for (const h of G.hits) {
      const t = h.age / HIT_SECONDS;
      ctx.globalAlpha = 1 - t * t;
      ctx.font = `bold ${h.boosted ? 40 : 30}px ${FONT}`;
      const y = h.y - 30 - HIT_RISE * t;
      ctx.lineWidth = 8;
      ctx.strokeStyle = COLORS.hitOutline;
      ctx.strokeText(h.text, h.x, y);
      ctx.fillStyle = h.boosted ? COLORS.hitBoosted : COLORS.hit;
      ctx.fillText(h.text, h.x, y);
    }
    ctx.globalAlpha = 1;
  }

  // 給自動測試用：讀目前這一局（不影響遊戲）
  window.formulaGuardTest = { get session() { return G && G.session; } };

  // ---------- 開始 ----------
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (G) draw(); });
  showLevelSelect();
})();
</script>
